[package]
name = "dot-graffle"
version = "0.1.0"
edition = "2024"
license = "Parity-7.0.0"
authors = ["C J Silverio <ceejceej@gmail.com>"]
categories = ["command-line-utilities", "encoding", "visualization"]
description = "graphviz to OmniGraffle and back."
exclude = [ "fixtures/", ".github/", ".justfile", ".rustfmt.toml" ]
homepage = "https://github.com/ceejbot/dot-graffle"
keywords = ["graffle", "graphviz", "omnigraffle", "dot"]
readme = "README.md"
repository = "https://github.com/ceejbot/dot-graffle"
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
dot-parser = { version = "0.6.1", features = ["display"] }
miette = "7.6.0"
plist = "1.9.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = { level = "deny", priority = 0 }
future_incompatible = { level = "deny", priority = 1 }
rust_2018_idioms = { level = "warn", priority = 2 }
trivial_casts = { level = "warn", priority = 3 }
trivial_numeric_casts = { level = "warn", priority = 4 }
unused_lifetimes = { level = "warn", priority = 5 }
unused_qualifications = { level = "warn", priority = 6 }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true        # Enable full link-time optimization
codegen-units = 1 # Single codegen unit for better optimization
opt-level = 3     # Maximum optimization
strip = true      # Strip symbols for smaller binary
panic = "abort"   # Smaller binary, no unwinding
